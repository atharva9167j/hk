name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-native-binaries:
    name: Build Native Binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            artifact_name: libhk-linux-x86_64.so
          - os: ubuntu-latest
            target: aarch64-linux
            artifact_name: libhk-linux-aarch64.so
          - os: windows-latest
            target: x86_64-windows
            artifact_name: hk.dll
          - os: macos-latest
            target: aarch64-macos
            artifact_name: libhk-macos-arm64.dylib

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: master

      - name: Build Dynamic Library
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: zig-out/lib/*

  build-python-wheel:
    name: Build Python Wheels & Sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build Source Distribution and Wheel
        run: python -m build

      - name: Upload Python Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  create-github-release:
    name: Create GitHub Release
    needs: [build-native-binaries, build-python-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
