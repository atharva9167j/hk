name: Release & Package Sync

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: 'Publish to PyPI'
        required: true
        type: boolean
        default: true
      publish_npm:
        description: 'Publish to NPM'
        required: true
        type: boolean
        default: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-native-binaries:
    name: Build Native Binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            artifact_name: libhk-linux-x86_64.so
          - os: ubuntu-latest
            target: aarch64-linux
            artifact_name: libhk-linux-aarch64.so
          - os: windows-latest
            target: x86_64-windows
            artifact_name: hk.dll
          - os: macos-latest
            target: aarch64-macos
            artifact_name: libhk-macos-arm64.dylib

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Build Dynamic Library
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: zig-out/lib/*

  build-python-wheel:
    name: Build Python Wheels & Sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build Source Distribution and Wheel
        run: python -m build

      - name: Upload Python Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  create-github-release:
    name: Create GitHub Release
    needs: [build-native-binaries, build-python-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true

  publish-pypi:
    name: Publish to PyPI (pip)
    needs: [build-python-wheel, create-github-release]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi)
    permissions:
      id-token: write # Mandatory for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Download Python Artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          # Fallback to token if repository secret exists, otherwise uses OIDC
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-npm:
    name: Publish to NPM
    needs: [create-github-release]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_npm)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies & Build TypeScript
        run: |
          cd bindings/js
          npm ci || npm install
          npm run build

      - name: Publish to NPM Registry
        run: |
          cd bindings/js
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
