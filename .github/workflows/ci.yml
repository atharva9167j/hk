name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  native-zig:
    name: Native Zig Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: master

      - name: Run Zig Native Unit Tests
        run: zig build test --summary all

      - name: Build C Dynamic Library
        run: zig build

      - name: Test Cross-Compilation Matrix (from Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          zig build -Dtarget=x86_64-linux -Doptimize=ReleaseFast
          zig build -Dtarget=aarch64-linux -Doptimize=ReleaseFast
          zig build -Dtarget=x86_64-windows -Doptimize=ReleaseFast
          zig build -Dtarget=aarch64-macos -Doptimize=ReleaseFast

  python-test-matrix:
    name: Python Tests (${{ matrix.os }} / Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Zig (for dynamic library build)
        uses: mlugg/setup-zig@v1
        with:
          version: master

      - name: Build HK Native Engine
        run: zig build -Doptimize=ReleaseFast

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel build pytest
          pip install torch numpy safetensors transformers gguf
          pip install -e .

      - name: Verify HK CLI
        run: |
          python -m hk.cli --help
          hk --help

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v --durations=10

  multilingual-bindings:
    name: Multilingual SDK Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust Bindings
        run: |
          cd bindings/rust
          cargo check --verbose
          cargo test --no-run

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify C# Bindings
        run: |
          cd bindings/csharp
          dotnet build -c Release

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java Bindings
        run: |
          cd bindings/java
          javac com/hk/HkModel.java

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Go Bindings
        run: |
          cd bindings/go
          go vet ./...
