name: Feature Request / Architecture Enhancement
description: Suggest an idea, new quantization method, or kernel optimization for HK
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature or improvement to HK!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: e.g. I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered.

  - type: dropdown
    id: component
    attributes:
      label: Target Component
      options:
        - Zig Native Engine / Core
        - Quantization Zoo / SIMD Kernels
        - Python SDK & PyTorch Integration
        - CLI Tools & Transcoders
        - Multilingual Bindings (Rust, C#, Go, Java, TS)
        - Documentation / Examples
    validations:
      required: true
