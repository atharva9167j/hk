name: 'Setup Zig'
description: 'Install official Zig 0.16.0 binaries directly from ziglang.org'
inputs:
  version:
    description: 'Zig version to install'
    required: false
    default: '0.16.0'

runs:
  using: 'composite'
  steps:
    - name: Install Zig on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        ARCH=$(uname -m)
        if [ "$ARCH" = "x86_64" ]; then
          ZIG_ARCH="x86_64"
        elif [ "$ARCH" = "aarch64" ]; then
          ZIG_ARCH="aarch64"
        else
          ZIG_ARCH="x86_64"
        fi
        URL="https://ziglang.org/download/${{ inputs.version }}/zig-${ZIG_ARCH}-linux-${{ inputs.version }}.tar.xz"
        echo "Downloading Zig from $URL"
        curl -fsSL "$URL" -o /tmp/zig.tar.xz
        mkdir -p "$RUNNER_TEMP/zig"
        tar -xJf /tmp/zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
        echo "$RUNNER_TEMP/zig" >> $GITHUB_PATH

    - name: Install Zig on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        ARCH=$(uname -m)
        if [ "$ARCH" = "arm64" ]; then
          ZIG_ARCH="aarch64"
        else
          ZIG_ARCH="x86_64"
        fi
        URL="https://ziglang.org/download/${{ inputs.version }}/zig-${ZIG_ARCH}-macos-${{ inputs.version }}.tar.xz"
        echo "Downloading Zig from $URL"
        curl -fsSL "$URL" -o /tmp/zig.tar.xz
        mkdir -p "$RUNNER_TEMP/zig"
        tar -xJf /tmp/zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
        echo "$RUNNER_TEMP/zig" >> $GITHUB_PATH

    - name: Install Zig on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $url = "https://ziglang.org/download/${{ inputs.version }}/zig-x86_64-windows-${{ inputs.version }}.zip"
        Write-Host "Downloading Zig from $url"
        curl.exe -fsSL -o "$env:RUNNER_TEMP\zig.zip" $url
        Expand-Archive "$env:RUNNER_TEMP\zig.zip" -DestinationPath "$env:RUNNER_TEMP\zig_dir" -Force
        $zigDir = "$env:RUNNER_TEMP\zig_dir\zig-x86_64-windows-${{ inputs.version }}"
        Write-Host "Adding $zigDir to PATH"
        $zigDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
